name: Sync v2rayA data-and-upgrades docs

# 每周一 03:17 UTC（北京时间 11:17）检查上游 README 的「数据与升级」章节，
# 有变化就只提交 docs/v2raya-data-and-upgrades.md 里那两段原文。
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-v2raya-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync upstream section
        run: python3 scripts/sync-upstream.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- docs/v2raya-data-and-upgrades.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游章节无变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2raya-data-and-upgrades.md
          git commit -m "docs: 同步 v2rayA 官方「数据与升级」章节"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "已提交更新"

      - name: Summary
        if: always()
        run: |
          {
            echo "### v2rayA 文档同步"
            echo ""
            echo "- 上游：https://github.com/v2rayA/v2rayA#data-and-upgrades"
            echo "- 结果：${{ steps.commit.outputs.changed == 'true' && '已更新并提交' || '无变化' }}"
          } >> "$GITHUB_STEP_SUMMARY"
